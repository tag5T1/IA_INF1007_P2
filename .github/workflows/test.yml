name: Tests
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      
      - run: pip install -r requirements.txt
      - run: |
          python -m pytest -v || code=$?
          if [ "${code:-0}" -eq 5 ]; then
            echo "No tests were collected; treating as success."
          elif [ "${code:-0}" -ne 0 ]; then
            exit "${code}"
          fi
