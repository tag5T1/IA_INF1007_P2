name: Tests
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - run: pip install -r requirements.txt
      - run: python -m pytest /IA_INF1007_P2/tests -v
